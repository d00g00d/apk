name: Patch APK (Pine + DPI) & Build Store JSON

on:
  release:
    types: [published, created, edited, deleted, prereleased, released]
  workflow_dispatch:
    inputs:
      default_dpi:
        description: "DPI по умолчанию для новых APK"
        required: false
        default: "240"

concurrency:
  group: release-store-sync
  cancel-in-progress: false

jobs:
  patch-and-build-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Apktool & Android Build-Tools
        run: |
          sudo mkdir -p /usr/local/bin
          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          pip install requests androguard

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Patch releases and generate store.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEFAULT_DPI: ${{ github.event.inputs.default_dpi || '240' }}
        run: |
          python .github/scripts/process_releases.py

      - name: Cleanup Keystore
        if: always()
        run: rm -f release.jks

      - name: Commit and push store.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: patch apks with Pine/DPI and update store.json"
            git push
          else
            echo "Изменений в store.json нет"
          fi
