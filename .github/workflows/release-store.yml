name: Sync Releases & Build Store JSON

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch: # Позволяет запустить вручную кнопкой в Actions

concurrency:
  group: release-store-sync
  cancel-in-progress: false # Очередь, чтобы параллельные загрузки не ломали store.json

jobs:
  build-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Доступ на изменение релизов и коммит store.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests androguard

      - name: Process releases and generate store.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/process_releases.py

      - name: Commit and push store.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update store.json from releases"
            git push
          else
            echo "No changes to store.json"
          fi
